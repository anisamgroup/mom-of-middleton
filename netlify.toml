[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["plan/MOM-Protection-Plan-Agreement.pdf"]

# One version of the site for Google: always https://momofmiddleton.com (no http, no www)
[[redirects]]
  from = "http://momofmiddleton.com/*"
  to = "https://momofmiddleton.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.momofmiddleton.com/*"
  to = "https://momofmiddleton.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.momofmiddleton.com/*"
  to = "https://momofmiddleton.com/:splat"
  status = 301
  force = true

# Common typo: /plans → /plan/ (sign-up page). Query strings like ?change=1 carry over.
[[redirects]]
  from = "/plans"
  to = "/plan/"
  status = 301
  force = true

[[redirects]]
  from = "/plans/*"
  to = "/plan/"
  status = 301
  force = true

# Nov 8, 2026: Pavers division taken off the site (code saved in the GitHub branch "pavers-archive").
# Old links and the Pavers QR codes on business cards / EDDM mailers land on the home page instead of an error page.
[[redirects]]
  from = "/pavers/*"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/pavers"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/tips/*"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/tips"
  to = "/"
  status = 302
  force = true
