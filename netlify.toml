[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["plan/MOM-Protection-Plan-Agreement.pdf"]

# Common typo: /plans → /plan/ (sign-up page). Query strings like ?change=1 carry over.
[[redirects]]
  from = "/plans"
  to = "/plan/"
  status = 301
  force = true

[[redirects]]
  from = "/plans/*"
  to = "/plan/"
  status = 301
  force = true
